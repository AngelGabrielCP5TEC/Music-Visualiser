[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-visual-intelligence"
version = "0.1.2"
description = "Lightweight, SciPy-free audio analysis core for Music Visual Intelligence."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1,<3",
    "soundfile>=0.13,<1",
    "Pillow>=11,<13",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
mvi = "music_visual_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["music_visual_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
